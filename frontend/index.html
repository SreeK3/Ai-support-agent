<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Support Agent</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f2f5;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 800px;
            height: 90vh;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: #1F3864;
            color: white;
            padding: 20px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-header .avatar {
            width: 42px;
            height: 42px;
            background: #2E75B6;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .chat-header h1 { font-size: 18px; font-weight: 600; }
        .chat-header p { font-size: 12px; opacity: 0.8; }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #4CAF50;
            border-radius: 50%;
            margin-left: auto;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            display: flex;
            gap: 10px;
            max-width: 80%;
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }

        .bot-avatar { background: #1F3864; color: white; }
        .user-avatar { background: #2E75B6; color: white; }

        .message-bubble {
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.6;
        }

        .message.bot .message-bubble {
            background: #f0f2f5;
            color: #1a1a1a;
            border-radius: 4px 16px 16px 16px;
        }

        .message.user .message-bubble {
            background: #1F3864;
            color: white;
            border-radius: 16px 4px 16px 16px;
        }

        .message-bubble ol,
        .message-bubble ul {
            padding-left: 20px;
            margin: 8px 0;
        }

        .message-bubble li {
            margin: 4px 0;
        }

        .message-bubble strong {
            font-weight: 600;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
            background: #f0f2f5;
            border-radius: 4px 16px 16px 16px;
            width: fit-content;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: #999;
            border-radius: 50%;
            animation: typing 1s infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-8px); }
        }

        .chat-input-area {
            padding: 16px 24px;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .chat-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 24px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .chat-input:focus { border-color: #2E75B6; }

        .send-button {
            width: 44px;
            height: 44px;
            background: #1F3864;
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .send-button:hover { background: #2E75B6; }

        .clear-button {
            padding: 8px 16px;
            background: transparent;
            color: #999;
            border: 1px solid #e0e0e0;
            border-radius: 16px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .clear-button:hover { background: #f0f2f5; color: #666; }

        .welcome-message {
            text-align: center;
            color: #999;
            font-size: 13px;
            margin: auto;
        }

        .welcome-message h2 {
            font-size: 24px;
            color: #1F3864;
            margin-bottom: 8px;
        }

        .suggestion-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-top: 16px;
        }

        .chip {
            padding: 8px 16px;
            background: #f0f2f5;
            border: 1px solid #e0e0e0;
            border-radius: 16px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            color: #1F3864;
        }

        .chip:hover {
            background: #1F3864;
            color: white;
            border-color: #1F3864;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <!-- Header -->
        <div class="chat-header">
            <div class="avatar">🤖</div>
            <div>
                <h1>Aisu</h1>
                <p>AI Assistant</p>
            </div>
            <div class="status-dot"></div>
        </div>

        <!-- Messages -->
        <div class="chat-messages" id="chatMessages">
            <div class="welcome-message">
                <h2>👋 Hi, I'm Aisu!</h2>
                <p>Your AsuiTech AI assistant. Ask me anything about our company, services, or support!</p>
                <div class="suggestion-chips">
                    <div class="chip" onclick="askQuestion('What services do you offer?')">What services do you offer?</div>
                    <div class="chip" onclick="askQuestion('How can I contact support?')">How can I contact support?</div>
                    <div class="chip" onclick="askQuestion('Do you offer free consultations?')">Free consultations?</div>
                    <div class="chip" onclick="askQuestion('What industries do you serve?')">What industries do you serve?</div>
                </div>
            </div>
        </div>

        <!-- Input -->
        <div class="chat-input-area">
            <button class="clear-button" onclick="clearHistory()">Clear chat</button>
            <input
                type="text"
                class="chat-input"
                id="questionInput"
                placeholder="Ask me anything..."
                onkeypress="handleKeyPress(event)"
            />
            <button class="send-button" onclick="sendMessage()">➤</button>
        </div>
    </div>

    <script>
        function formatMarkdown(text) {
            return text
                // Bold
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                // Italic
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                // Numbered list items
                .replace(/^\d+\.\s(.+)$/gm, '<li>$1</li>')
                // Bullet list items
                .replace(/^[\*\-]\s(.+)$/gm, '<li>$1</li>')
                // Wrap consecutive <li> in <ol>
                .replace(/(<li>[\s\S]*?<\/li>)(\s*<li>[\s\S]*?<\/li>)*/g, '<ol>$&</ol>')
                // Line breaks
                .replace(/\n\n/g, '<br><br>')
                .replace(/\n/g, '<br>');
        }

        function addMessage(text, isUser) {
            const messagesDiv = document.getElementById('chatMessages');

            // Remove welcome message if exists
            const welcome = messagesDiv.querySelector('.welcome-message');
            if (welcome) welcome.remove();

            const formatted = isUser ? text : formatMarkdown(text);

            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'bot'}`;
            messageDiv.innerHTML = `
                <div class="message-avatar ${isUser ? 'user-avatar' : 'bot-avatar'}">
                    ${isUser ? '👤' : '🤖'}
                </div>
                <div class="message-bubble">${formatted}</div>
            `;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function showTyping() {
            const messagesDiv = document.getElementById('chatMessages');
            const typing = document.createElement('div');
            typing.className = 'message bot';
            typing.id = 'typingIndicator';
            typing.innerHTML = `
                <div class="message-avatar bot-avatar">🤖</div>
                <div class="typing-indicator">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
            `;
            messagesDiv.appendChild(typing);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function hideTyping() {
            const typing = document.getElementById('typingIndicator');
            if (typing) typing.remove();
        }

        async function sendMessage() {
            const input = document.getElementById('questionInput');
            const question = input.value.trim();
            if (!question) return;

            addMessage(question, true);
            input.value = '';
            showTyping();

            try {
                const response = await fetch('/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: question })
                });

                const data = await response.json();
                hideTyping();
                addMessage(data.answer, false);

            } catch (error) {
                hideTyping();
                addMessage('Sorry, something went wrong. Please try again.', false);
            }
        }

        function askQuestion(question) {
            document.getElementById('questionInput').value = question;
            sendMessage();
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') sendMessage();
        }

        async function clearHistory() {
            await fetch('/clear', { method: 'DELETE' });
            const messagesDiv = document.getElementById('chatMessages');
            messagesDiv.innerHTML = `
                <div class="welcome-message">
                    <h2>👋 Hello!</h2>
                    <p>I'm your AI support assistant. Ask me anything about our company!</p>
                    <div class="suggestion-chips">
                        <div class="chip" onclick="askQuestion('What services do you offer?')">What services do you offer?</div>
                        <div class="chip" onclick="askQuestion('How can I contact support?')">How can I contact support?</div>
                        <div class="chip" onclick="askQuestion('Do you offer free consultations?')">Free consultations?</div>
                        <div class="chip" onclick="askQuestion('What industries do you serve?')">What industries do you serve?</div>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
